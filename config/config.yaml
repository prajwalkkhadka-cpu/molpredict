# MolPredict configuration. Every key below is read by molpredict/pipeline.py.

data:
  path: "data/sample_data.csv"
  smiles_col: "smiles"
  target_col: "logP"
  test_size: 0.15          # fraction of ALL data
  val_size: 0.15           # fraction of the remaining train+val data
  random_seed: 42
  split_method: "scaffold" # "scaffold" (recommended) or "random"

features:
  fingerprint:
    radius: 2              # 2 = ECFP4
    n_bits: 2048
  descriptors:
    enabled: true
    normalize: true        # z-score, fitted on the training split only
    # names: [MolWt, TPSA]   # optional override of the default descriptor list

model:
  mlp:
    hidden_dims: [512, 128]
    dropout: 0.3
    batch_norm: true
    activation: "relu"     # relu | gelu | silu

training:
  epochs: 100
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 1.0e-5
  gradient_clip: 1.0
  scheduler:
    warmup_epochs: 5       # linear warm-up, then cosine decay
    min_lr: 1.0e-6
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.0001
  device: "auto"           # auto | cpu | cuda | mps

checkpoint:
  dir: "checkpoints/"
